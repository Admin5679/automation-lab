---
- name: HPE Smart Array Health Check
  hosts: all
  become: true
  gather_facts: true
  serial: 1

  vars:

    #################################################################
    # SSACLI Package Locations
    #################################################################

    ssacli_package: "/root/AutomationLab/packages/ssacli-6.60-8.0_amd64.deb"

    remote_package: "/tmp/ssacli-6.60-8.0_amd64.deb"

    #################################################################
    # Report Locations
    #################################################################

    remote_report_directory: "/tmp/ssacli-reports"

    remote_report_file: >-
      {{ remote_report_directory }}/{{ inventory_hostname }}_ssacli_health_report.txt

    local_report_directory: "/tmp/ssacli-reports"

    local_report_file: >-
      {{ local_report_directory }}/{{ inventory_hostname }}_ssacli_health_report.txt

  tasks:

    #################################################################
    # Operating System Validation
    #################################################################

    - name: Confirm target operating system is Debian based
      ansible.builtin.assert:
        that:
          - ansible_os_family == "Debian"
        success_msg: "Debian-based operating system detected."
        fail_msg: "This playbook supports Debian-based systems only."

    - name: Get hostname
      ansible.builtin.command:
        cmd: hostname
      register: hostname_info
      changed_when: false

    - name: Get kernel version
      ansible.builtin.command:
        cmd: uname -r
      register: kernel_info
      changed_when: false

    - name: Get server uptime
      ansible.builtin.command:
        cmd: uptime -p
      register: uptime_info
      changed_when: false
      failed_when: false

    - name: Get server architecture
      ansible.builtin.command:
        cmd: uname -m
      register: architecture_info
      changed_when: false
      failed_when: false

    #################################################################
    # SSACLI Installation Validation
    #################################################################

    - name: Check whether SSACLI executable is available
      ansible.builtin.shell:
        cmd: command -v ssacli
      register: ssacli_binary
      changed_when: false
      failed_when: false

    - name: Check whether SSACLI package is installed
      ansible.builtin.command:
        argv:
          - dpkg-query
          - -W
          - "-f=${Status}"
          - ssacli
      register: ssacli_package_check
      changed_when: false
      failed_when: false

    - name: Set initial SSACLI installation status
      ansible.builtin.set_fact:
        ssacli_installed_before: >-
          {{
            ssacli_binary.rc == 0 or
            (
              ssacli_package_check.rc == 0 and
              'install ok installed' in ssacli_package_check.stdout
            )
          }}

    - name: Set SSACLI installation action
      ansible.builtin.set_fact:
        ssacli_installation_action: >-
          {{
            'Already installed before validation'
            if ssacli_installed_before
            else
            'Installed by this playbook'
          }}

    #################################################################
    # Install SSACLI When Missing
    #################################################################

    - name: Verify local SSACLI package exists
      ansible.builtin.stat:
        path: "{{ ssacli_package }}"
      delegate_to: localhost
      become: false
      register: local_ssacli_package
      when: not ssacli_installed_before

    - name: Stop when local SSACLI package is missing
      ansible.builtin.fail:
        msg: >-
          SSACLI package was not found on the Ansible controller at
          {{ ssacli_package }}
      when:
        - not ssacli_installed_before
        - not local_ssacli_package.stat.exists

    - name: Copy SSACLI package to target server
      ansible.builtin.copy:
        src: "{{ ssacli_package }}"
        dest: "{{ remote_package }}"
        owner: root
        group: root
        mode: "0644"
      when: not ssacli_installed_before

    - name: Install SSACLI package
      ansible.builtin.apt:
        deb: "{{ remote_package }}"
        state: present
      when: not ssacli_installed_before

    #################################################################
    # Verify SSACLI Installation
    #################################################################

    - name: Verify SSACLI executable after installation
      ansible.builtin.shell:
        cmd: command -v ssacli
      register: ssacli_verify
      changed_when: false
      failed_when: ssacli_verify.rc != 0

    - name: Get SSACLI package version
      ansible.builtin.command:
        argv:
          - dpkg-query
          - -W
          - "-f=${Version}"
          - ssacli
      register: ssacli_package_version
      changed_when: false
      failed_when: false

    - name: Get SSACLI utility version
      ansible.builtin.command:
        cmd: ssacli version
      register: ssacli_version
      changed_when: false
      failed_when: false

    #################################################################
    # Load Required Linux Storage Module
    #################################################################

    - name: Check whether SCSI generic module is loaded
      ansible.builtin.shell:
        cmd: lsmod | grep -w sg
      register: sg_module_check
      changed_when: false
      failed_when: false

    - name: Load SCSI generic module when missing
      ansible.builtin.command:
        cmd: modprobe sg
      register: sg_module_load
      changed_when: sg_module_load.rc == 0
      failed_when: false
      when: sg_module_check.rc != 0

    - name: Verify SCSI generic module status
      ansible.builtin.shell:
        cmd: lsmod | grep -w sg
      register: sg_module_status
      changed_when: false
      failed_when: false

    #################################################################
    # HPE Smart Array Controller Information
    #################################################################

    - name: Get controller information
      ansible.builtin.command:
        cmd: ssacli ctrl all show
      register: controller_information
      changed_when: false
      failed_when: false

    - name: Get controller status
      ansible.builtin.command:
        cmd: ssacli ctrl all show status
      register: controller_status
      changed_when: false
      failed_when: false

    - name: Get controller details
      ansible.builtin.command:
        cmd: ssacli ctrl all show detail
      register: controller_detail
      changed_when: false
      failed_when: false

    #################################################################
    # RAID Configuration
    #################################################################

    - name: Get RAID configuration
      ansible.builtin.command:
        cmd: ssacli ctrl all show config
      register: raid_config
      changed_when: false
      failed_when: false

    - name: Get detailed RAID configuration
      ansible.builtin.command:
        cmd: ssacli ctrl all show config detail
      register: raid_config_detail
      changed_when: false
      failed_when: false

    #################################################################
    # Physical Drive Information
    #################################################################

    - name: Get physical drive status
      ansible.builtin.command:
        cmd: ssacli ctrl all pd all show status
      register: physical_drive_status
      changed_when: false
      failed_when: false

    - name: Get physical drive details
      ansible.builtin.command:
        cmd: ssacli ctrl all pd all show detail
      register: physical_drive_detail
      changed_when: false
      failed_when: false

    #################################################################
    # Logical Drive Information
    #################################################################

    - name: Get logical drive status
      ansible.builtin.command:
        cmd: ssacli ctrl all ld all show status
      register: logical_drive_status
      changed_when: false
      failed_when: false

    - name: Get logical drive details
      ansible.builtin.command:
        cmd: ssacli ctrl all ld all show detail
      register: logical_drive_detail
      changed_when: false
      failed_when: false

    #################################################################
    # Array Information
    #################################################################

    - name: Get array status
      ansible.builtin.command:
        cmd: ssacli ctrl all array all show status
      register: array_status
      changed_when: false
      failed_when: false

    - name: Get array details
      ansible.builtin.command:
        cmd: ssacli ctrl all array all show detail
      register: array_detail
      changed_when: false
      failed_when: false

    #################################################################
    # Cache and Battery Information
    #################################################################

    - name: Extract controller cache and battery information
      ansible.builtin.shell:
        cmd: >-
          ssacli ctrl all show detail |
          grep -Ei
          'cache|battery|capacitor|backup power|temperature|firmware'
      register: cache_battery_status
      changed_when: false
      failed_when: false

    #################################################################
    # Linux Filesystem Information
    #################################################################

    - name: Get filesystem usage
      ansible.builtin.command:
        cmd: df -h
      register: filesystem_usage
      changed_when: false
      failed_when: false

    - name: Get inode usage
      ansible.builtin.command:
        cmd: df -i
      register: inode_usage
      changed_when: false
      failed_when: false

    #################################################################
    # Linux Block Device Information
    #
    # MOUNTPOINT is used instead of MOUNTPOINTS because older
    # versions of lsblk do not support the MOUNTPOINTS column.
    #################################################################

    - name: Get block device information
      ansible.builtin.command:
        argv:
          - lsblk
          - -o
          - NAME,SIZE,TYPE,FSTYPE,MOUNTPOINT
      register: block_devices
      changed_when: false
      failed_when: false

    #################################################################
    # Linux Mount Information
    #################################################################

    - name: Get mounted filesystem information
      ansible.builtin.command:
        cmd: mount
      register: mount_information
      changed_when: false
      failed_when: false

    #################################################################
    # Kernel Storage Messages
    #################################################################

    - name: Get recent kernel disk errors
      ansible.builtin.shell:
        cmd: >-
          dmesg -T |
          grep -Ei
          'disk error|I/O error|medium error|bad sector|failed command' |
          tail -100
      register: kernel_disk_errors
      changed_when: false
      failed_when: false

    #################################################################
    # Determine Controller Detection Status
    #################################################################

    - name: Determine whether HPE controller is detected
      ansible.builtin.set_fact:
        controller_detected: >-
          {{
            controller_information.rc == 0 and
            controller_information.stdout | trim | length > 0
          }}

    #################################################################
    # Determine Physical Drive Count
    #################################################################

    - name: Count physical drives returned by SSACLI
      ansible.builtin.set_fact:
        physical_drive_count: >-
          {{
            physical_drive_status.stdout_lines
            | select('search', 'physicaldrive')
            | list
            | length
          }}

    #################################################################
    # Determine Logical Drive Count
    #################################################################

    - name: Count logical drives returned by SSACLI
      ansible.builtin.set_fact:
        logical_drive_count: >-
          {{
            logical_drive_status.stdout_lines
            | select('search', 'logicaldrive')
            | list
            | length
          }}

    #################################################################
    # Determine Storage Warning Status
    #################################################################

    - name: Determine whether storage warning is present
      ansible.builtin.set_fact:
        storage_warning_detected: >-
          {{
            (
              controller_status.stdout ~ ' ' ~
              controller_status.stderr ~ ' ' ~
              raid_config.stdout ~ ' ' ~
              raid_config.stderr ~ ' ' ~
              physical_drive_status.stdout ~ ' ' ~
              physical_drive_status.stderr ~ ' ' ~
              logical_drive_status.stdout ~ ' ' ~
              logical_drive_status.stderr ~ ' ' ~
              array_status.stdout ~ ' ' ~
              array_status.stderr
            )
            is regex(
              '(?i)(failed|failure|degraded|predictive failure|offline|recovering|rebuilding)'
            )
          }}

    #################################################################
    # Determine Linux Disk Warning Status
    #################################################################

    - name: Determine whether kernel disk warning is present
      ansible.builtin.set_fact:
        kernel_disk_warning_detected: >-
          {{
            kernel_disk_errors.stdout | trim | length > 0
          }}

    #################################################################
    # Set Overall Storage Status
    #################################################################

    - name: Set overall storage validation result
      ansible.builtin.set_fact:
        overall_storage_status: >-
          {{
            'NO SUPPORTED HPE CONTROLLER DETECTED'
            if not controller_detected
            else
            (
              'ATTENTION REQUIRED'
              if storage_warning_detected or kernel_disk_warning_detected
              else
              'HEALTHY'
            )
          }}

    #################################################################
    # Set Controller Output Text
    #################################################################

    - name: Set controller information output
      ansible.builtin.set_fact:
        controller_information_output: >-
          {{
            controller_information.stdout
            if controller_information.stdout | trim | length > 0
            else
            (
              controller_information.stderr
              if controller_information.stderr | trim | length > 0
              else
              'No controller information returned'
            )
          }}

    - name: Set controller status output
      ansible.builtin.set_fact:
        controller_status_output: >-
          {{
            controller_status.stdout
            if controller_status.stdout | trim | length > 0
            else
            (
              controller_status.stderr
              if controller_status.stderr | trim | length > 0
              else
              'No controller status returned'
            )
          }}

    - name: Set controller detail output
      ansible.builtin.set_fact:
        controller_detail_output: >-
          {{
            controller_detail.stdout
            if controller_detail.stdout | trim | length > 0
            else
            (
              controller_detail.stderr
              if controller_detail.stderr | trim | length > 0
              else
              'No controller details returned'
            )
          }}

    #################################################################
    # Set RAID Output Text
    #################################################################

    - name: Set RAID configuration output
      ansible.builtin.set_fact:
        raid_config_output: >-
          {{
            raid_config.stdout
            if raid_config.stdout | trim | length > 0
            else
            (
              raid_config.stderr
              if raid_config.stderr | trim | length > 0
              else
              'No RAID configuration returned'
            )
          }}

    - name: Set detailed RAID configuration output
      ansible.builtin.set_fact:
        raid_config_detail_output: >-
          {{
            raid_config_detail.stdout
            if raid_config_detail.stdout | trim | length > 0
            else
            (
              raid_config_detail.stderr
              if raid_config_detail.stderr | trim | length > 0
              else
              'No detailed RAID configuration returned'
            )
          }}

    #################################################################
    # Set Physical Drive Output Text
    #################################################################

    - name: Set physical drive status output
      ansible.builtin.set_fact:
        physical_drive_status_output: >-
          {{
            physical_drive_status.stdout
            if physical_drive_status.stdout | trim | length > 0
            else
            (
              physical_drive_status.stderr
              if physical_drive_status.stderr | trim | length > 0
              else
              'No physical drive status returned'
            )
          }}

    - name: Set physical drive detail output
      ansible.builtin.set_fact:
        physical_drive_detail_output: >-
          {{
            physical_drive_detail.stdout
            if physical_drive_detail.stdout | trim | length > 0
            else
            (
              physical_drive_detail.stderr
              if physical_drive_detail.stderr | trim | length > 0
              else
              'No physical drive details returned'
            )
          }}

    #################################################################
    # Set Logical Drive Output Text
    #################################################################

    - name: Set logical drive status output
      ansible.builtin.set_fact:
        logical_drive_status_output: >-
          {{
            logical_drive_status.stdout
            if logical_drive_status.stdout | trim | length > 0
            else
            (
              logical_drive_status.stderr
              if logical_drive_status.stderr | trim | length > 0
              else
              'No logical drive status returned'
            )
          }}

    - name: Set logical drive detail output
      ansible.builtin.set_fact:
        logical_drive_detail_output: >-
          {{
            logical_drive_detail.stdout
            if logical_drive_detail.stdout | trim | length > 0
            else
            (
              logical_drive_detail.stderr
              if logical_drive_detail.stderr | trim | length > 0
              else
              'No logical drive details returned'
            )
          }}

    #################################################################
    # Set Array Output Text
    #################################################################

    - name: Set array status output
      ansible.builtin.set_fact:
        array_status_output: >-
          {{
            array_status.stdout
            if array_status.stdout | trim | length > 0
            else
            (
              array_status.stderr
              if array_status.stderr | trim | length > 0
              else
              'No array status returned'
            )
          }}

    - name: Set array detail output
      ansible.builtin.set_fact:
        array_detail_output: >-
          {{
            array_detail.stdout
            if array_detail.stdout | trim | length > 0
            else
            (
              array_detail.stderr
              if array_detail.stderr | trim | length > 0
              else
              'No array details returned'
            )
          }}

    #################################################################
    # Set Linux Storage Output Text
    #################################################################

    - name: Set block device output
      ansible.builtin.set_fact:
        block_device_output: >-
          {{
            block_devices.stdout
            if block_devices.stdout | trim | length > 0
            else
            (
              block_devices.stderr
              if block_devices.stderr | trim | length > 0
              else
              'Block device information unavailable'
            )
          }}

    - name: Set kernel disk error output
      ansible.builtin.set_fact:
        kernel_disk_error_output: >-
          {{
            kernel_disk_errors.stdout
            if kernel_disk_errors.stdout | trim | length > 0
            else
            'No recent kernel disk errors detected'
          }}

    #################################################################
    # Create Report Directory on Target Server
    #################################################################

    - name: Create remote report directory
      ansible.builtin.file:
        path: "{{ remote_report_directory }}"
        state: directory
        owner: root
        group: root
        mode: "0755"

    #################################################################
    # Generate Clean Text Report
    #################################################################

    - name: Generate clean SSACLI health report
      ansible.builtin.copy:
        dest: "{{ remote_report_file }}"
        owner: root
        group: root
        mode: "0644"
        content: |
          ============================================================
          HPE SMART ARRAY HEALTH REPORT
          ============================================================

          SERVER INFORMATION
          ------------------------------------------------------------
          Hostname                : {{ hostname_info.stdout }}
          Inventory Name          : {{ inventory_hostname }}
          Operating System        : {{ ansible_distribution }} {{ ansible_distribution_version }}
          Operating System Family : {{ ansible_os_family }}
          Kernel                  : {{ kernel_info.stdout }}
          Architecture            : {{ architecture_info.stdout | default('Not available', true) }}
          Uptime                  : {{ uptime_info.stdout | default('Not available', true) }}
          Report Date             : {{ ansible_date_time.iso8601 }}

          SSACLI INFORMATION
          ------------------------------------------------------------
          Installation Status     : {{ ssacli_installation_action }}
          Executable Path         : {{ ssacli_verify.stdout | default('Not available', true) }}
          Package Version         : {{ ssacli_package_version.stdout | default('Not available', true) }}
          Utility Version         : {{ ssacli_version.stdout | default('Not available', true) }}
          SCSI Generic Module     : {{ 'Loaded' if sg_module_status.rc == 0 else 'Not loaded or unavailable' }}

          CONTROLLER SUMMARY
          ------------------------------------------------------------
          Controller Detected     : {{ 'Yes' if controller_detected else 'No' }}
          {{ controller_information_output | trim }}

          CONTROLLER STATUS
          ------------------------------------------------------------
          {{ controller_status_output | trim }}

          CONTROLLER DETAILS
          ------------------------------------------------------------
          {{ controller_detail_output | trim }}

          CACHE, BATTERY AND FIRMWARE INFORMATION
          ------------------------------------------------------------
          {{ cache_battery_status.stdout | default('No cache, battery or firmware information returned', true) | trim }}

          RAID CONFIGURATION
          ------------------------------------------------------------
          {{ raid_config_output | trim }}

          DETAILED RAID CONFIGURATION
          ------------------------------------------------------------
          {{ raid_config_detail_output | trim }}

          ARRAY STATUS
          ------------------------------------------------------------
          {{ array_status_output | trim }}

          ARRAY DETAILS
          ------------------------------------------------------------
          {{ array_detail_output | trim }}

          PHYSICAL DRIVE SUMMARY
          ------------------------------------------------------------
          Physical Drive Count    : {{ physical_drive_count }}
          {{ physical_drive_status_output | trim }}

          PHYSICAL DRIVE DETAILS
          ------------------------------------------------------------
          {{ physical_drive_detail_output | trim }}

          LOGICAL DRIVE SUMMARY
          ------------------------------------------------------------
          Logical Drive Count     : {{ logical_drive_count }}
          {{ logical_drive_status_output | trim }}

          LOGICAL DRIVE DETAILS
          ------------------------------------------------------------
          {{ logical_drive_detail_output | trim }}

          FILESYSTEM USAGE
          ------------------------------------------------------------
          {{ filesystem_usage.stdout | default('Filesystem information unavailable', true) | trim }}

          INODE USAGE
          ------------------------------------------------------------
          {{ inode_usage.stdout | default('Inode information unavailable', true) | trim }}

          BLOCK DEVICES
          ------------------------------------------------------------
          {{ block_device_output | trim }}

          MOUNTED FILESYSTEMS
          ------------------------------------------------------------
          {{ mount_information.stdout | default('Mount information unavailable', true) | trim }}

          RECENT KERNEL DISK ERRORS
          ------------------------------------------------------------
          {{ kernel_disk_error_output | trim }}

          VALIDATION RETURN CODES
          ------------------------------------------------------------
          Controller Information  : {{ controller_information.rc }}
          Controller Status       : {{ controller_status.rc }}
          Controller Details      : {{ controller_detail.rc }}
          RAID Configuration      : {{ raid_config.rc }}
          Physical Drive Status   : {{ physical_drive_status.rc }}
          Physical Drive Details  : {{ physical_drive_detail.rc }}
          Logical Drive Status    : {{ logical_drive_status.rc }}
          Logical Drive Details   : {{ logical_drive_detail.rc }}
          Block Device Check      : {{ block_devices.rc }}

          OVERALL VALIDATION RESULT
          ------------------------------------------------------------
          HPE Controller Detected : {{ 'Yes' if controller_detected else 'No' }}
          Physical Drive Count    : {{ physical_drive_count }}
          Logical Drive Count     : {{ logical_drive_count }}
          Storage Warning         : {{ 'Yes' if storage_warning_detected else 'No' }}
          Kernel Disk Warning     : {{ 'Yes' if kernel_disk_warning_detected else 'No' }}
          Storage Status          : {{ overall_storage_status }}

          REPORT LOCATION
          ------------------------------------------------------------
          Target Server Report    : {{ remote_report_file }}
          Controller Report       : {{ local_report_file }}

          ============================================================
          END OF REPORT
          ============================================================

    #################################################################
    # Verify Target Report
    #################################################################

    - name: Verify remote report was created
      ansible.builtin.stat:
        path: "{{ remote_report_file }}"
      register: remote_report_status

    - name: Stop when remote report was not created
      ansible.builtin.fail:
        msg: >-
          SSACLI health report was not created at
          {{ remote_report_file }}
      when: not remote_report_status.stat.exists

    #################################################################
    # Create Report Directory on Ansible Controller
    #################################################################

    - name: Create local report directory
      ansible.builtin.file:
        path: "{{ local_report_directory }}"
        state: directory
        mode: "0755"
      delegate_to: localhost
      become: false

    #################################################################
    # Fetch Report to Ansible Controller
    #################################################################

    - name: Fetch report to Ansible controller
      ansible.builtin.fetch:
        src: "{{ remote_report_file }}"
        dest: "{{ local_report_file }}"
        flat: true

    #################################################################
    # Verify Local Report
    #################################################################

    - name: Verify fetched report exists on Ansible controller
      ansible.builtin.stat:
        path: "{{ local_report_file }}"
      delegate_to: localhost
      become: false
      register: local_report_status

    - name: Stop when fetched report was not created
      ansible.builtin.fail:
        msg: >-
          Report was created on the target server but was not fetched
          to {{ local_report_file }}
      when: not local_report_status.stat.exists

    #################################################################
    # Clean Up Temporary Package
    #################################################################

    - name: Remove copied SSACLI package
      ansible.builtin.file:
        path: "{{ remote_package }}"
        state: absent
      when: not ssacli_installed_before
